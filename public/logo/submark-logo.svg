<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Velvet">
  <title>Velvet</title>
  <defs>
    <!-- Left wing gradient: muted forest sage to deep pine -->
    <linearGradient id="leftWing" x1="0%" y1="30%" x2="100%" y2="80%">
      <stop offset="0%"   stop-color="#2d3e30"/>
      <stop offset="50%"  stop-color="#5f7e5c"/>
      <stop offset="100%" stop-color="#789575"/>
    </linearGradient>

    <!-- Right wing gradient: forest sage highlight to deep pine -->
    <linearGradient id="rightWing" x1="0%" y1="30%" x2="100%" y2="80%">
      <stop offset="0%"   stop-color="#a8c2a5"/>
      <stop offset="50%"  stop-color="#789575"/>
      <stop offset="100%" stop-color="#2d3e30"/>
    </linearGradient>

    <!-- Soft glow at top-centre where the two wings meet -->
    <radialGradient id="glowCentre" cx="50%" cy="38%" r="30%">
      <stop offset="0%"  stop-color="#e5e8ce" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#e5e8ce" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle ambient glow behind the whole mark -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#789575" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#e5e8ce" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop/inner shadow filter for depth -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient purple glow behind mark (matches the luminous halo in the PNG) -->
  <ellipse cx="100" cy="108" rx="62" ry="48" fill="url(#ambientGlow)"/>

  <!--
    LEFT WING of the V
    Starts at the top-left tip, curves inward with a tucked/folded ribbon shape,
    meets the sharp bottom point, and closes up the centre crease.

    Key points:
      Top-left outer tip  : (28, 62)
      Curl peak (top-left): (40, 54)   — the upward-curling tip
      Centre top crease   : (100, 72)  — where both wings meet at top
      Bottom point        : (100, 148) — sharp V bottom
  -->
  <path
    d="
      M 40,54
      C 34,52  26,58  28,66
      C 30,74  38,78  52,88
      C 64,96  80,106 100,148
      C 100,148 100,72 100,72
      C 82,66  58,56  40,54
      Z
    "
    fill="url(#leftWing)"
    filter="url(#glow)"
  />

  <!--
    RIGHT WING of the V
    Mirror of the left wing — starts at top-right tip, curves inward,
    meets centre crease at top, runs to sharp bottom point.
  -->
  <path
    d="
      M 160,54
      C 166,52  174,58  172,66
      C 170,74  162,78  148,88
      C 136,96  120,106 100,148
      C 100,148 100,72 100,72
      C 118,66  142,56  160,54
      Z
    "
    fill="url(#rightWing)"
    filter="url(#glow)"
  />

  <!-- Centre crease — a thin bright highlight line running from top-centre to bottom point -->
  <line
    x1="100" y1="72"
    x2="100" y2="148"
    stroke="#e5e8ce"
    stroke-width="0.8"
    stroke-opacity="0.6"
  />

  <!-- Bright lavender glow overlay at the top-centre join (the brightest spot in the PNG) -->
  <ellipse
    cx="100" cy="68"
    rx="22" ry="8"
    fill="url(#glowCentre)"
  />
</svg>
